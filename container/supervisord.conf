; Every piece restarts on its own if it dies; Docker restarts the whole
; container if supervisord itself does.
[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_SCREEN)s -nolisten tcp
priority=10
autorestart=true

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
priority=20
autorestart=true
startsecs=2

[program:chromium]
command=/usr/local/bin/start-chromium
user=pwuser
environment=DISPLAY=":99",HOME="/home/pwuser"
priority=30
autorestart=true
startsecs=3
startretries=1000

[program:cdp]
command=/usr/bin/socat TCP-LISTEN:9223,fork,reuseaddr TCP:127.0.0.1:9222
priority=40
autorestart=true

[program:x11vnc]
; A VNC password is the second lock behind Cloudflare Access: the port is
; reachable on the LAN, and without it the LAN would have the browser.
command=/bin/sh -c 'x11vnc -storepasswd "$VNC_PASSWORD" /tmp/vncpass >/dev/null && exec x11vnc -display :99 -forever -shared -rfbauth /tmp/vncpass -localhost -rfbport 5900 -quiet'
priority=50
autorestart=true
startsecs=2

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5900
priority=60
autorestart=true
